# Mod metadata; generateModMetadata in build.gradle fills in the values from gradle.properties.
license="${mod_license}"
issueTrackerURL="https://github.com/IoaNNUwU/runeruin/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/IoaNNUwU/runeruin"
iconFile="runeruin:icon.png"
authors="ioannuwu"
description='''
A work-in-progress dimension of stacked caves: the Void, the Lost caves, the Deep caves, the Blooming caves and the open top layer lie one above the other, each with biomes, plants, mobs and structures of its own.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
