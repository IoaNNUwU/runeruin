plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs. The Blockbench projects in
    // models/entity are not among them: the game builds the mob models from them (BlockbenchModel).
    exclude(".cache/**") // datagen cache files (paths are relative to the resource root)
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.2, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    // runClient only; RUNERUIN_GAME_DIR moves it elsewhere.
    def persistentGameDirectory = project.file(
            System.getenv('RUNERUIN_GAME_DIR')
                    ?: new File(System.getProperty('user.home'), '.runeruin/game').absolutePath
    )

    runs {
        client {
            client()
            gameDirectory = persistentGameDirectory

            // The game directory is shared by all checkouts: /rrsave writes a template into this one.
            systemProperty 'runeruin.checkout', project.projectDir.absolutePath

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Headless preview: pick a job with -Ppreview=<id> (or list).
        //   .\gradlew.bat runPreview
        //   .\gradlew.bat runPreview -Ppreview=boulder -Pseed=3 -Pradius=10
        //   .\gradlew.bat runPreview -Ppreview=boulder -Pseeds=1-9
        //   .\gradlew.bat runPreview -Ppreview=list
        //   .\gradlew.bat runPreview -Ppreview=world_region '-Pregion=exports/terrain_expected.json' -Pstage=generated
        preview {
            server()
            programArgument '--nogui'
            systemProperty 'runeruin.preview', project.findProperty('preview') ?: 'giant_goblet'
            systemProperty 'runeruin.preview.seed', project.findProperty('seed') ?: '1'
            if (findProperty('previewName') != null) {
                systemProperty 'runeruin.preview.name', findProperty('previewName')
            }
            ['seeds', 'height', 'radius', 'stage'].each { key ->
                if (findProperty(key) != null) {
                    systemProperty "runeruin.preview.${key}", findProperty(key)
                }
            }
            if (findProperty('region') != null) {
                systemProperty 'runeruin.preview.region', project.file(findProperty('region')).absolutePath
            }
            project.properties.each { key, value ->
                if (key instanceof String && key.startsWith('arg.')) {
                    systemProperty "runeruin.preview.${key.substring(4)}", value
                }
            }
        }

        data {
            clientData()

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()

            // The structure templates kept as text (.snbt), which data generation turns into .nbt.
            systemProperty 'runeruin.templates', file('src/main/resources/').absolutePath

            // Entity models for scripts/render_entity_model.py: outside the resources, so not in the jar.
            systemProperty 'runeruin.entityModels', layout.buildDirectory.dir('entity_models').get().asFile.absolutePath
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// An agent sandbox may remap GRADLE_USER_HOME to a temp dir, which would make
// downloadAssets / createMinecraftArtifacts re-fetch and re-decompile Minecraft.
// Pin NFRT to the real user Gradle cache so datagen reuses client jars, assets, and decompiles.
def persistentNfrtHome = new File(
        System.getenv('USERPROFILE') ?: System.getenv('HOME') ?: System.getProperty('user.home'),
        '.gradle/caches/neoformruntime'
)
tasks.withType(net.neoforged.nfrtgradle.NeoFormRuntimeTask).configureEach {
    homeDirectory.set(persistentNfrtHome)
}

// NeoForge sources jar (net.neoforged.*) for extractMcSources. Minecraft sources already
// come from createMinecraftArtifacts as minecraft-patched-*-sources.jar.
configurations {
    neoForgeAgentSources {
        description = 'NeoForge sources jar extracted into .mc-sources'
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

interface ExtractMcSourcesServices {
    @javax.inject.Inject
    org.gradle.api.file.ArchiveOperations getArchiveOperations()
}

def extractArchives = objects.newInstance(ExtractMcSourcesServices).archiveOperations
def minecraftSourcesJar = layout.buildDirectory.file("moddev/artifacts/minecraft-patched-${neo_version}-sources.jar")
def mcSourcesDir = layout.projectDirectory.dir('.mc-sources')
def mcSourcesStamp = layout.buildDirectory.file('tmp/mc-sources-VERSION.txt')
def mcSourcesVersionText = "minecraft=${minecraft_version}\nneoforge=${neo_version}\nmappings=official\ncontent=code,textures\n"
// NeoForm Runtime stores the 26.2.0 client archive under its release id, 26.2.
def minecraftClientVersion = minecraft_version.replaceAll(/\.0$/, '')
def minecraftClientJar = new File(persistentNfrtHome, "artifacts/minecraft_${minecraftClientVersion}_client.jar")

tasks.register('writeMcSourcesVersion') {
    def stamp = mcSourcesStamp
    def text = mcSourcesVersionText
    inputs.property('contents', text)
    outputs.file(stamp)
    doLast {
        def f = stamp.get().asFile
        f.parentFile.mkdirs()
        f.setText(text, 'UTF-8')
    }
}

tasks.register('extractMcSources', Sync) {
    group = 'setup'
    description = 'Extract Minecraft and NeoForge sources into .mc-sources/code, vanilla textures and models into .mc-sources/textures.'
    dependsOn 'createMinecraftArtifacts', 'writeMcSourcesVersion'
    onlyIf {
        def versionFile = mcSourcesDir.file('VERSION.txt').asFile
        def hasExpectedVersion = versionFile.isFile() && versionFile.getText('UTF-8').trim() == mcSourcesVersionText.trim()
        if (versionFile.isFile() && !hasExpectedVersion) {
            def sourcePath = mcSourcesDir.asFile.toPath()
            def realPath = sourcePath.toRealPath().toString()
            def absolutePath = sourcePath.toAbsolutePath().normalize().toString()
            if (!realPath.equalsIgnoreCase(absolutePath)) {
                throw new GradleException(
                        "'.mc-sources' points to a cache for another version. Run scripts/setup-worktree.ps1 before extractMcSources."
                )
            }
        }
        !hasExpectedVersion
    }
    // With CI=true ModDevGradle builds Minecraft without decompiling it, so there is no sources jar:
    // CI extracts only the textures and models that the asset lint checks.
    if (System.getenv('CI') != 'true') {
        from(minecraftSourcesJar.map { extractArchives.zipTree(it) }) {
            include '**/*.java'
            into 'code'
        }
        from(configurations.neoForgeAgentSources.elements.map { locations ->
            locations.collect { extractArchives.zipTree(it.asFile) }
        }) {
            include '**/*.java'
            into 'code'
        }
    }
    from(provider { extractArchives.zipTree(minecraftClientJar) }) {
        include 'assets/minecraft/textures/**', 'assets/minecraft/models/**'
        into 'textures'
    }
    from(mcSourcesStamp) {
        rename { 'VERSION.txt' }
    }
    into mcSourcesDir
    includeEmptyDirs = false
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

neoForge.ideSyncTask tasks.named('extractMcSources')

dependencies {
    neoForgeAgentSources "net.neoforged:neoforge:${project.neo_version}:sources"
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// A model that moves from data generation into src/main/resources stays in src/generated until the next
// runData removes it there. src/main/resources comes first, so the file a person keeps wins;
// scripts/lint_assets.py reports a file that data generation still writes.
tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // The game loads the .nbt that runData makes from a template kept as text; runClient reads the text itself.
    exclude '**/*.snbt'
}

// The entity model export runs only with runData and nothing refers to it: keep it out of the mod jar.
tasks.named('jar', Jar).configure {
    exclude '**/datagen/EntityModelExport*'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
