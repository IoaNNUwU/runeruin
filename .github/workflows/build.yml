name: Build

# Task branches build through their pull request only, once per push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # A draft pull request that claims an issue has only an empty commit.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.changed_files > 0 }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # src/generated is not in git. Separate invocation: runData depends on
      # processResources, so it cannot be ordered before it within one build.
      # The asset lint checks vanilla parents and textures against .vanilla-textures.
      - name: Datagen and vanilla assets
        run: ./gradlew runData extractVanillaTextures

      - name: Asset lint
        run: python3 scripts/lint_assets.py

      - name: GameTests and build
        run: ./gradlew runGameTestServer build

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: runeruin-jar
          path: build/libs/*.jar