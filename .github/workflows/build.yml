name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # src/generated is not in git. Separate invocation: runData depends on
      # processResources, so it cannot be ordered before it within one build.
      - name: Datagen
        run: ./gradlew runData

      - name: GameTests and build
        run: ./gradlew runGameTestServer build

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: runeruin-jar
          path: build/libs/*.jar